name: amd-mi210-gpu-tests

# On-hardware GPU coverage tests for the HIP backend, ported from the Buildkite
# pipeline that used to run this under Slurm + pyxis
# (.buildkite/amd-mi210-debug-tests.yml, removed).
#
# The runner is registered directly on the four-way MI210 box, so there is no
# batch scheduler in the path: the job shells out to rootless podman, using the
# same `selfish` base image the Buildkite step pulled through pyxis.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'AUTHORS.md'
      - 'LICENSE.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'AUTHORS.md'
      - 'LICENSE.md'
      - 'README.md'
  workflow_dispatch:

# One physical box, and the MPI tests claim every GPU on it. Never let two runs
# of this workflow overlap on the same ref.
concurrency:
  group: mi210-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SELFISH_IMAGE: higherordermethods/selfish:latest-x86-rocm643-gfx90a

jobs:
  build-and-test:
    name: MI210 (gfx90a) - coverage
    runs-on: galapagos-mi210x4
    timeout-minutes: 120
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner and podman configuration
        run: |
          id
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} runtime={{.Host.OCIRuntime.Name}}'
          ls -l /dev/kfd /dev/dri

      # A shared runner IP hits Docker Hub's anonymous pull limit sooner than a
      # hosted one would. Log in when the credentials the docker-publish workflow
      # already uses are available, and carry on anonymously when they are not.
      # The check has to happen in the shell: the secrets context is not one of
      # the contexts a step-level `if` may read.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "${DOCKERHUB_TOKEN}" \
              | podman login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          else
            echo "No Docker Hub credentials configured; pulling anonymously."
          fi

      - name: Pull the selfish base image
        run: podman pull "${SELFISH_IMAGE}"

      - name: Check the GPUs are visible inside the container
        run: |
          podman run --rm \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add keep-groups \
            --security-opt seccomp=unconfined \
            --security-opt label=disable \
            "${SELFISH_IMAGE}" \
            rocm-smi --showid --showproductname

      - name: Build and run the test suite
        run: |
          # --group-add keep-groups passes the runner account's supplementary
          #   groups (video, render) through to the container. Without it a
          #   rootless container cannot open /dev/kfd.
          # --cap-add SYS_PTRACE lets Open MPI use CMA for its shared-memory
          #   transport. If a future runtime still blocks process_vm_readv, set
          #   OMPI_MCA_btl_sm_single_copy_mechanism=none below instead.
          # --security-opt label=disable keeps SELinux from confining the device
          #   nodes and the bind-mounted workspace on an SELinux host.
          # --network=host avoids rootless slirp/pasta, which Open MPI's
          #   interface selection does not need to see.
          # Rootless podman maps container root onto the runner account, so the
          #   build products written into /workspace stay owned by the runner.
          podman run --rm -i \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add keep-groups \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt label=disable \
            --ipc=host \
            --network=host \
            -v "${GITHUB_WORKSPACE}":/workspace \
            -w /workspace \
            "${SELFISH_IMAGE}" \
            bash -s <<'EOS'
          set -euo pipefail

          source /opt/spack-environment/activate.sh

          # Unlike pyxis, which ran the container as the submitting user, a
          # rootless podman container is uid 0 inside. Open MPI refuses to launch
          # as root without an explicit acknowledgement; 5.x reads the PRTE_
          # names, 4.x the OMPI_ ones.
          export PRTE_ALLOW_RUN_AS_ROOT=1
          export PRTE_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

          mkdir -p /workspace/build
          cd /workspace/build

          FC=gfortran cmake \
                -DCMAKE_INSTALL_PREFIX=/workspace/opt/self \
                -DCMAKE_BUILD_TYPE="coverage" \
                -DSELF_ENABLE_GPU=ON \
                -DSELF_GPU_BACKEND=HIP \
                -DSELF_ENABLE_TESTING=ON \
                -DCMAKE_HIP_ARCHITECTURES="gfx90a" \
                -DGPU_TARGETS="gfx90a" \
                -DSELF_ENABLE_EXAMPLES=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_VERBOSE_MAKEFILE=ON \
                /workspace/

          make -j"$(nproc)" VERBOSE=1

          lcov --capture --initial \
               --directory /workspace/build/src/ \
               --output-file /workspace/initial.info

          export WORKSPACE=/workspace
          ctest --test-dir /workspace/build --output-on-failure

          lcov --capture \
               --directory /workspace/build/src/ \
               --output-file /workspace/ctest-capture.info

          lcov --add-tracefile /workspace/initial.info \
               --add-tracefile /workspace/ctest-capture.info \
               --output-file /workspace/coverage.info
          EOS

      # lcov records source paths as seen inside the container (/workspace/src/...).
      # Strip the mount point so Codecov matches them against the repository tree.
      - name: Rewrite coverage paths to be repo-relative
        run: sed -i 's|^SF:/workspace/|SF:|' "${GITHUB_WORKSPACE}/coverage.info"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.info
          flags: gha-rocm-mi210
          fail_ci_if_error: false

      - name: Upload ctest logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mi210-ctest-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7

      # Re-pulling :latest leaves the previous image untagged. Reap those so the
      # runner's storage does not grow without bound.
      - name: Prune dangling images
        if: ${{ always() }}
        run: podman image prune -f
